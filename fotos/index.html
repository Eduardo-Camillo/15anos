<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#13251B">
<title>Fotos · 15 anos Milena Acosta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../imagens/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="../imagens/icone-512.png">
<link rel="apple-touch-icon" href="../imagens/apple-touch-icon.png">
<link rel="stylesheet" href="../css/tema.css">
<style>
  /* ===== ETAPA 4: ENVIO DE FOTOS ===== */
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    font-size: 21px;
    line-height: 1.35;
    font-variant-numeric: lining-nums;
  }
  main { width: 100%; max-width: 440px; text-align: center; }

  /* Selo "M" recortado da foto do envelope */
  .selo {
    --t: 112px;
    --s: calc(var(--t) / 161);
    display: block;
    width: var(--t);
    height: var(--t);
    margin: 0 auto 10px;
    background: url("../imagens/envelope.jpg") no-repeat;
    background-size: calc(1280 * var(--s)) calc(853 * var(--s));
    background-position: calc(-557 * var(--s)) calc(-318 * var(--s));
    -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 71%);
            mask-image: radial-gradient(circle, #000 62%, transparent 71%);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
  }

  .idade { margin: 0; font-size: 22px; letter-spacing: .25em; text-transform: uppercase; }
  h1 {
    margin: 0 0 4px;
    font-family: var(--fonte-script);
    font-weight: 400;
    font-size: clamp(46px, 13vw, 60px);
    line-height: 1.25;
  }
  .subtitulo { margin: 0 0 26px; font-size: 22px; font-style: italic; color: var(--prata); }

  .ornamento {
    display: flex; align-items: center; gap: 8px;
    margin: 0 auto 24px; width: 75%; color: var(--prata);
  }
  .ornamento::before, .ornamento::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .6; }
  .ornamento svg { width: 20px; fill: currentColor; }

  .botao {
    display: block;
    width: 100%;
    padding: 22px 16px;
    font-family: var(--fonte-texto);
    font-size: 27px;
    font-weight: 700;
    color: var(--verde-profundo);
    background: linear-gradient(180deg, #F4F5F4 0%, #CFD3D0 48%, #A9AEAA 52%, #DDE0DE 100%);
    border: 1px solid rgba(255,255,255,.6);
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.4), inset 0 1px 0 #fff;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .botao:active { transform: scale(.98); }
  .botao:focus-visible { outline: 2px solid var(--prata-clara); outline-offset: 4px; }
  .botao svg { display: block; width: 40px; height: 40px; margin: 0 auto 6px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .botao-secundario {
    background: transparent;
    color: var(--prata-clara);
    border: 1.5px solid var(--prata);
    box-shadow: none;
    text-shadow: none;
    font-size: 22px;
    padding: 16px;
    margin-top: 16px;
  }

  label.nome { display: block; text-align: left; margin-top: 28px; font-size: 19px; color: var(--prata); }
  input[type="text"] {
    width: 100%;
    margin-top: 6px;
    padding: 14px 16px;
    font-family: var(--fonte-texto);
    font-size: 21px;
    color: var(--prata-clara);
    background: rgba(0,0,0,.25);
    border: 1.5px solid rgba(196,200,197,.5);
    border-radius: 12px;
  }
  input[type="text"]::placeholder { color: rgba(196,200,197,.55); }
  input[type="text"]:focus { outline: none; border-color: var(--prata-clara); }
  input[type="file"] { display: none; }

  .barra { height: 16px; background: rgba(0,0,0,.35); border: 1px solid rgba(196,200,197,.35); border-radius: 8px; overflow: hidden; margin: 22px 0 12px; }
  .barra > div { height: 100%; width: 0; background: linear-gradient(180deg, #F4F5F4, #A9AEAA); transition: width .3s; }
  .grande { font-size: 26px; font-weight: 600; margin: 0; }
  .aviso { font-size: 19px; color: var(--prata); font-style: italic; }
  .sucesso .grande { font-family: var(--fonte-script); font-weight: 400; font-size: 52px; line-height: 1.3; }
  #msgDetalhe { color: var(--prata); margin: 4px 0 26px; }
  .erro { color: #E8B4AE !important; }

  [hidden] { display: none !important; }
</style>
</head>
<body class="fundo-cetim">
<main>
  <span class="selo" aria-hidden="true"></span>
  <p class="idade texto-prata">15 anos</p>
  <h1 class="texto-prata">Milena Acosta</h1>
  <div class="ornamento" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2z"/></svg></div>

  <!-- TELA 1: inicial -->
  <section id="telaInicio">
    <p class="subtitulo">Compartilhe com a gente as fotos que você tirou na festa</p>

    <button class="botao" id="btnEscolher">
      <svg viewBox="0 0 24 24"><path d="M3.5 8.5A2 2 0 0 1 5.5 6.5h2l1.6-2.2h5.8l1.6 2.2h2a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg>
      Enviar minhas fotos
    </button>
    <input type="file" id="arquivos" accept="image/*" multiple>

    <label class="nome" for="nome">Seu nome (opcional):
      <input type="text" id="nome" autocomplete="name" placeholder="Ex.: Tia Maria">
    </label>
  </section>

  <!-- TELA 2: enviando -->
  <section id="telaEnviando" hidden>
    <p class="grande">Enviando suas fotos…</p>
    <div class="barra"><div id="progresso"></div></div>
    <p id="contador" class="grande">0 de 0</p>
    <p class="aviso">Não feche esta tela até terminar.</p>
  </section>

  <!-- TELA 3: final -->
  <section id="telaFim" class="sucesso" hidden>
    <p class="grande texto-prata" id="msgFinal">Obrigado!</p>
    <p id="msgDetalhe"></p>
    <button class="botao" id="btnMais">Enviar mais fotos</button>
    <button class="botao botao-secundario" id="btnTentar" hidden>Tentar de novo as que faltaram</button>
  </section>
</main>

<script>
  // ===== CONFIGURAÇÃO (preencha aqui) =====
  const URL_DO_SCRIPT  = 'https://script.google.com/macros/s/AKfycbxaqeUiq714tZJ04cgbtfO7hK4ChMxc6nlOCeD2gji358PBQ0a1fyG5Iipm6gwzeuaGng/exec'; // igual à do Code.gs
  const CHAVE_EVENTO   = 'Milena15'; // igual à do Code.gs
  const LADO_MAXIMO    = 2400;  // pixels; reduz o peso sem perder qualidade visível
  const QUALIDADE_JPEG = 0.88;
  // ========================================

  const $ = id => document.getElementById(id);

  // Lembra o nome digitado na próxima vez
  try { $('nome').value = localStorage.getItem('nomeConvidado') || ''; } catch (e) {}

  let pendentes = [];

  $('btnEscolher').onclick = () => $('arquivos').click();
  $('btnMais').onclick = () => { mostrar('telaInicio'); $('arquivos').click(); };
  $('btnTentar').onclick = () => enviarTodas(pendentes);

  $('arquivos').onchange = e => {
    const lista = Array.from(e.target.files || []);
    e.target.value = '';
    if (lista.length) enviarTodas(lista);
  };

  function mostrar(tela) {
    ['telaInicio', 'telaEnviando', 'telaFim'].forEach(t => $(t).hidden = (t !== tela));
  }

  async function enviarTodas(lista) {
    const nome = $('nome').value.trim();
    try { localStorage.setItem('nomeConvidado', nome); } catch (e) {}

    mostrar('telaEnviando');
    const falharam = [];
    for (let i = 0; i < lista.length; i++) {
      $('contador').textContent = (i + 1) + ' de ' + lista.length;
      $('progresso').style.width = (i / lista.length * 100) + '%';
      const deuCerto = await enviarComTentativas(lista[i], nome);
      if (!deuCerto) falharam.push(lista[i]);
    }
    $('progresso').style.width = '100%';
    pendentes = falharam;
    terminar(lista.length, falharam.length);
  }

  function terminar(total, erros) {
    const enviadas = total - erros;
    if (erros === 0) {
      $('msgFinal').textContent = 'Obrigado!';
      $('msgDetalhe').textContent = enviadas === 1 ? 'Sua foto foi enviada.' : 'Suas ' + enviadas + ' fotos foram enviadas.';
      $('msgFinal').classList.remove('erro');
      $('btnTentar').hidden = true;
    } else {
      $('msgFinal').textContent = enviadas ? 'Quase tudo certo!' : 'Não conseguimos enviar';
      $('msgDetalhe').textContent = enviadas + ' enviada(s). ' + erros + ' não foi(foram). Verifique a internet e toque no botão abaixo.';
      $('msgFinal').classList.toggle('erro', enviadas === 0);
      $('btnTentar').hidden = false;
    }
    mostrar('telaFim');
  }

  async function enviarComTentativas(arquivo, nome) {
    let preparado;
    try { preparado = await prepararFoto(arquivo); }
    catch (e) { return false; }

    for (let tentativa = 1; tentativa <= 3; tentativa++) {
      try {
        const r = await fetch(URL_DO_SCRIPT, {
          method: 'POST',
          redirect: 'follow',
          // text/plain evita bloqueio de CORS no Google Apps Script
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            chave: CHAVE_EVENTO,
            convidado: nome,
            nomeArquivo: arquivo.name || 'foto',
            tipo: preparado.tipo,
            base64: preparado.base64
          })
        });
        const json = await r.json();
        if (json.ok) return true;
        if (/chave|tipo|grande/.test(json.erro || '')) return false; // não adianta repetir
      } catch (e) { /* rede instável: tenta de novo */ }
      await new Promise(ok => setTimeout(ok, 1500 * tentativa));
    }
    return false;
  }

  // Reduz a foto para no máximo LADO_MAXIMO px (fica bem mais leve).
  // Se o navegador não conseguir abrir a imagem, envia o arquivo original.
  async function prepararFoto(arquivo) {
    try {
      const img = await carregarImagem(arquivo);
      const escala = Math.min(1, LADO_MAXIMO / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * escala);
      canvas.height = Math.round(img.height * escala);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', QUALIDADE_JPEG);
      return { tipo: 'image/jpeg', base64: dataUrl.split(',')[1] };
    } catch (e) {
      const dataUrl = await lerComoDataURL(arquivo);
      return { tipo: arquivo.type || 'image/jpeg', base64: dataUrl.split(',')[1] };
    }
  }

  function carregarImagem(arquivo) {
    return new Promise((ok, falha) => {
      const url = URL.createObjectURL(arquivo);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); ok(img); };
      img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('imagem')); };
      img.src = url;
    });
  }

  function lerComoDataURL(arquivo) {
    return new Promise((ok, falha) => {
      const leitor = new FileReader();
      leitor.onload = () => ok(leitor.result);
      leitor.onerror = falha;
      leitor.readAsDataURL(arquivo);
    });
  }
</script>
</body>
</html>
